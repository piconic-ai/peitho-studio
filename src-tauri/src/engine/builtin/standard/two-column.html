<section class="peitho-slide layout-two-column">
  <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
  <div class="columns">
    <div class="column"><slot name="left" accepts="blocks" arity="0..*"></slot></div>
    <div class="column"><slot name="right" accepts="blocks" arity="0..*"></slot></div>
  </div>
  <footer class="footnotes"><slot name="footnotes" accepts="blocks" arity="0..1"></slot></footer>
</section>
