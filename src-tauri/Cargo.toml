[package]
name = "app"
version = "0.1.0"
description = "An editor for Peitho decks"
authors = ["kfly8"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Off by default — pulls in a Unix-socket control server (tokio) purely for
# Playwright's "tauri" mode to drive the real WKWebView window in e2e tests.
# See docs/tauri-playwright-spike.md.
e2e-testing = ["tauri-plugin-playwright"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }
notify = "6"
tiny_http = "0.12"
sha2 = "0.10"

# Embeds peitho-core directly (in-process render, no `peitho preview`
# subprocess/HTTP round trip — see the architecture plan). Pinned to an
# upstream release tag since peitho-core's API carries no semver guarantee
# (it's the peitho CLI's internal engine, not a published crate); bump it in
# lockstep with the `peitho` CLI `peitho present` launches.
peitho-core = { git = "https://github.com/mizzy/peitho", tag = "v1.34.0" }

[dev-dependencies]
tempfile = "3"

# Optimize dependencies (not this crate) in dev builds. Unoptimized, syntect's
# first highlight is ~10x slower: building the default syntax set and
# compiling each language's regexes on first use made the first `open_deck`
# after launch take ~5s under `tauri dev`, vs ~0.5s in release. Costs one
# longer dependency build; this crate's own rebuilds are unaffected.
[profile.dev.package."*"]
opt-level = 3
