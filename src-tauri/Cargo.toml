[package]
name = "app"
version = "0.1.0"
description = "Desktop GUI wrapper around the Peitho presentation engine"
authors = ["kfly8"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
notify = "6"
tiny_http = "0.12"
sha2 = "0.10"

# Phase 1: embed peitho-core directly (in-process render, no `peitho preview`
# subprocess/HTTP round trip — see the architecture plan). Pinned to a local
# path against the sibling checkout for now; switch to a `git` dependency
# pinned to a release tag once this is validated, since peitho-core's API
# carries no semver guarantee (it's the peitho CLI's internal engine, not a
# published crate — see plan notes).
peitho-core = { path = "/Users/kfly8/src/github.com/mizzy/peitho/crates/peitho-core" }

[dev-dependencies]
tempfile = "3"
