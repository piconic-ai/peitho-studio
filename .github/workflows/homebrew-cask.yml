# Called after the release artifacts have been uploaded, including RCs.
# Can also be retried independently without rebuilding/notarizing the app.
name: homebrew-cask

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
        description: Token with Contents and Pull requests write access to piconic-ai/homebrew-tap
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Published release tag (e.g. v0.1.0 or v0.1.0-rc.8)

permissions:
  contents: read

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      TAP_REPO: piconic-ai/homebrew-tap
    steps:
      - name: Check tap credentials and release tag
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN with Contents and Pull requests write access to $TAP_REPO" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Download the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("Release is still a draft") else . end'
          mkdir -p "$RUNNER_TEMP/homebrew-dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Peitho-Studio_${TAG#v}_aarch64.dmg" --dir "$RUNNER_TEMP/homebrew-dmg"
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: piconic-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          path: homebrew-tap
          persist-credentials: false
      - name: Update Cask release metadata
        run: |
          bun run scripts/update-homebrew-cask.ts homebrew-tap/Casks/peitho-studio.rb \
            "$TAG" "$RUNNER_TEMP/homebrew-dmg/Peitho-Studio_${TAG#v}_aarch64.dmg"
          ruby -c homebrew-tap/Casks/peitho-studio.rb
          git -C homebrew-tap diff --check
      - name: Push update and open a pull request
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Cask already matches this release, or a newer release is installed in the tap"
            exit 0
          fi
          branch="peitho-studio-${TAG}"
          gh auth setup-git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/peitho-studio.rb
          git commit -m "Update Peitho Studio to ${TAG#v}"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --repo "$TAP_REPO" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            printf 'Update Peitho Studio to %s.\n\nDMG SHA-256 calculated from the published [release asset](https://github.com/%s/releases/tag/%s).\n' \
              "${TAG#v}" "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/homebrew-pr.md"
            gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
              --title "Update Peitho Studio to ${TAG#v}" --body-file "$RUNNER_TEMP/homebrew-pr.md"
          else
            echo "Updated existing PR #$pr"
          fi
