# Builds the macOS .dmg for a release tag and attaches it to that tag's
# GitHub Release.
#
# Two jobs, so that the one holding the Apple signing secrets cannot write
# to the repository and the one that can write never sees them:
#   - build-macos (contents: read) builds, signs and notarizes the app and
#     attests the build provenance of the dmg and the updater archive. It
#     hands them on as a workflow artifact.
#   - publish (contents: write) uploads them to the draft Release, writes
#     and signs the updater manifest, and publishes the Release.
# The provenance names this file as the signer, so a download can be
# checked with `gh attestation verify <file> --repo piconic-ai/peitho-studio
# --signer-workflow piconic-ai/peitho-studio/.github/workflows/release-build.yml`.
#
# Called from tagpr.yml once tagpr has tagged (and created the Release as
# a draft, see .tagpr), rather than triggered by `release: published`:
# tagpr creates the Release with GITHUB_TOKEN, and events caused by
# GITHUB_TOKEN never start other workflows. The draft is published here
# only after every asset is uploaded, so `releases/latest` never points at
# a Release whose `latest.json` is still missing. `workflow_dispatch`
# re-runs it by hand for an existing tag (e.g. a prerelease cut to try
# this workflow out); publishing an already published Release is a no-op.
#
# Signed with a Developer ID Application certificate and notarized with an
# App Store Connect API key, so Gatekeeper opens the app without asking the
# user to allow it in System Settings. `tauri build` does both itself from
# the APPLE_* env on the build step; the secrets it needs are listed in the
# "Check the signing secrets" step, which fails the run rather than let a
# missing secret silently ship an unsigned dmg.
#
# Apple Silicon only (aarch64-apple-darwin), the only architecture the app
# has been checked on.
#
# Every `uses:` is pinned to a commit SHA; the trailing comment records the
# tag it was at when pinned.
name: release-build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build and upload to (e.g. v0.1.0)
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build and upload to (e.g. v0.1.0)

permissions:
  contents: read

jobs:
  build-macos:
    # Pinned rather than macos-latest, so a new runner image (Xcode, SDK)
    # never changes what a release is built with unannounced.
    runs-on: macos-26
    permissions:
      contents: read
      # Build provenance: id-token signs it through Sigstore, attestations and
      # artifact-metadata store it on GitHub for `gh attestation verify`.
      id-token: write
      attestations: write
      artifact-metadata: write
    # Notarization alone took ~50 minutes on the first submission.
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Configure authenticated in-app updates
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Set TAURI_UPDATER_PUBLIC_KEY variable and TAURI_SIGNING_PRIVATE_KEY secret before releasing" >&2
            exit 1
          fi
          bun -e 'if (JSON.parse(await Bun.file("src-tauri/tauri.conf.json").text()).version !== process.env.TAG.replace(/^v/, "")) throw new Error("Release tag and app version differ"); const c = {bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.UPDATER_PUBLIC_KEY.trim()}}}; await Bun.write("src-tauri/updater-build.json", JSON.stringify(c))'
      - name: Check the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set" >&2
              missing=1
            fi
          done
          exit "$missing"
      # tauri reads the API key from a file, not from the env.
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # With CI=true, tauri's bundle_dmg skips the Finder step that lays
          # out the dmg window (bundle.macOS.dmg in tauri.conf.json): no
          # background picture, and the icons in Finder's default order.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build --target "$TARGET" --bundles app,dmg --config src-tauri/updater-build.json
      # tauri deletes the intermediate .app once the dmg is built, so check
      # the app as users get it: from inside the mounted dmg.
      - name: Verify the signature, notarization, bundled crit and window layout
        run: |
          dmgs=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "expected exactly one dmg, found: ${dmgs[*]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          codesign --verify --strict --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt"' EXIT
          app="$mnt/Peitho Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          # The bundled crit (bundle.externalBin) ships ad-hoc signed; it has
          # to come out re-signed like the app itself — same team, hardened
          # runtime — for notarization to cover it, and still run.
          crit="$app/Contents/MacOS/crit"
          codesign --verify --strict --verbose=2 "$crit"
          team_of() { codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          app_team=$(team_of "$app")
          crit_team=$(team_of "$crit")
          if [ -z "$app_team" ] || [ "$app_team" = "not set" ] || [ "$crit_team" != "$app_team" ]; then
            echo "crit is signed by team '$crit_team', the app by '$app_team'" >&2
            exit 1
          fi
          if ! codesign -dv "$crit" 2>&1 | grep -q '^CodeDirectory .*flags=.*runtime'; then
            echo "crit is not signed with the hardened runtime" >&2
            exit 1
          fi
          "$crit" --version
          test -f "$app/Contents/Resources/licenses/crit/LICENSE"
          # bundle_dmg's Finder step saves the window layout in .DS_Store.
          test -f "$mnt/.background/background.tiff"
          test -f "$mnt/.DS_Store"
      # Release asset names: GitHub rewrites an asset name containing a space
      # ("Peitho Studio.app.tar.gz" was stored as "Peitho.Studio.app.tar.gz"),
      # and the manifest URL must match the stored name exactly, so both get
      # a fixed, space-free name.
      - name: Collect the release files
        run: |
          version="${TAG#v}"
          dmgs=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          archives=(src-tauri/target/"$TARGET"/release/bundle/macos/*.app.tar.gz)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "expected exactly one dmg, found: ${dmgs[*]}" >&2
            exit 1
          fi
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}.sig" ]; then
            echo "Expected one signed updater archive" >&2
            exit 1
          fi
          dist="$RUNNER_TEMP/release"
          mkdir -p "$dist"
          cp "${dmgs[0]}" "$dist/Peitho-Studio_${version}_aarch64.dmg"
          cp "${archives[0]}" "$dist/Peitho-Studio_${version}_aarch64.app.tar.gz"
          cp "${archives[0]}.sig" "$dist/Peitho-Studio_${version}_aarch64.app.tar.gz.sig"
      - name: Attest build provenance of the dmg and the updater archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.app.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # For the tauri CLI that signs the manifest.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Upload the dmg and the updater archive to the release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber

      # All archives are uploaded first. Publish the signed manifest last;
      # RCs have artifacts but never become the stable update channel.
      - name: Publish signed stable manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            exit 0
          fi
          archive="$RUNNER_TEMP/release/Peitho-Studio_${version}_aarch64.app.tar.gz"
          gh release view "$TAG" --json body --jq .body > release-notes.txt
          bun run scripts/create-update-manifest.ts "$version" "$archive" release-notes.txt latest.json
          bunx tauri signer sign latest.json
          gh release upload "$TAG" latest.json latest.json.sig --clobber

      # Only now does `releases/latest` resolve to this tag. Publishing is
      # what makes the assets downloadable without a token, so
      # homebrew-cask.yml (which refuses drafts) must run after this.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  update-homebrew-cask:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-cask.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
