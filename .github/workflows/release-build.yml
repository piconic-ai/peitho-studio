# Builds the macOS .dmg for a release tag and attaches it to that tag's
# GitHub Release.
#
# Called from tagpr.yml once tagpr has tagged (and created the Release),
# rather than triggered by `release: published`: tagpr creates the Release
# with GITHUB_TOKEN, and events caused by GITHUB_TOKEN never start other
# workflows. `workflow_dispatch` re-runs it by hand for an existing tag
# (e.g. a prerelease cut to try this workflow out).
#
# Signed with a Developer ID Application certificate and notarized with an
# App Store Connect API key, so Gatekeeper opens the app without asking the
# user to allow it in System Settings. `tauri build` does both itself from
# the APPLE_* env on the build step; the secrets it needs are listed in the
# "Check the signing secrets" step, which fails the run rather than let a
# missing secret silently ship an unsigned dmg.
#
# Apple Silicon only (aarch64-apple-darwin), the only architecture the app
# has been checked on.
#
# Every `uses:` is pinned to a commit SHA; the trailing comment records the
# tag it was at when pinned.
name: release-build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build and upload to (e.g. v0.1.0)
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build and upload to (e.g. v0.1.0)

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    # Notarization alone took ~50 minutes on the first submission.
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Check the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY \
            APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set" >&2
              missing=1
            fi
          done
          exit "$missing"
      # tauri reads the API key from a file, not from the env.
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # With CI=true, tauri's bundle_dmg skips the Finder step that lays
          # out the dmg window (bundle.macOS.dmg in tauri.conf.json): no
          # background picture, and the icons in Finder's default order.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: bunx tauri build --target "$TARGET" --bundles dmg
      # tauri deletes the intermediate .app once the dmg is built, so check
      # the app as users get it: from inside the mounted dmg.
      - name: Verify the signature, notarization, bundled crit and window layout
        run: |
          dmgs=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "expected exactly one dmg, found: ${dmgs[*]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          codesign --verify --strict --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt"' EXIT
          app="$mnt/Peitho Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          # The bundled crit (bundle.externalBin) ships ad-hoc signed; it has
          # to come out re-signed like the app itself — same team, hardened
          # runtime — for notarization to cover it, and still run.
          crit="$app/Contents/MacOS/crit"
          codesign --verify --strict --verbose=2 "$crit"
          team_of() { codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          app_team=$(team_of "$app")
          crit_team=$(team_of "$crit")
          if [ -z "$app_team" ] || [ "$app_team" = "not set" ] || [ "$crit_team" != "$app_team" ]; then
            echo "crit is signed by team '$crit_team', the app by '$app_team'" >&2
            exit 1
          fi
          if ! codesign -dv "$crit" 2>&1 | grep -q '^CodeDirectory .*flags=.*runtime'; then
            echo "crit is not signed with the hardened runtime" >&2
            exit 1
          fi
          "$crit" --version
          test -f "$app/Contents/Resources/licenses/crit/LICENSE"
          # bundle_dmg's Finder step saves the window layout in .DS_Store.
          test -f "$mnt/.background/background.tiff"
          test -f "$mnt/.DS_Store"
      - name: Upload the dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          dmgs=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "expected exactly one dmg, found: ${dmgs[*]}" >&2
            exit 1
          fi
          dest="Peitho-Studio_${version}_aarch64.dmg"
          cp "${dmgs[0]}" "$dest"
          gh release upload "$TAG" "$dest" --clobber --repo "$GITHUB_REPOSITORY"
