name: complexity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complexity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.8.5
      - run: python3 -B -m unittest discover -s scripts -p test_complexity.py
      - run: python3 scripts/complexity.py
      - name: Publish summary
        run: cat complexity-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: complexity-report
          path: complexity-results/
          retention-days: 30
