# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
#
# Reusable entry point for the Pullfrog GitHub bot (https://github.com/pullfrog/pullfrog).
# The Pullfrog GitHub App dispatches this workflow via `workflow_dispatch` whenever a
# configured trigger fires (PR opened, review requested, `@pullfrog` mention, ...), so the
# trigger list itself lives in the Pullfrog console — NOT in this file.
#
# Cost posture for this repo:
#   - Model access uses the ChatGPT/Codex subscription authenticated with
#     `npx pullfrog auth codex`, not a metered OpenAI API key. Pullfrog keeps the
#     resulting credential in its encrypted store and injects it for each run.
#   - `model` pins Terra so every Pullfrog run uses the same balanced model.
#   - `timeout` bounds a single run's wall clock so a stuck agent cannot burn quota.
#   - This repo is public, so standard GitHub-hosted runner minutes are free; `timeout`
#     still matters for the subscription's rate limits above.
#
# Every `uses:` is pinned to a commit SHA. SHAs need a manual bump to pick up upstream
# fixes; the trailing comment records which tag each one was at when pinned.
name: Pullfrog

run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      # OIDC is how the action mints its scoped Pullfrog installation token.
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@22442cbbe9039fe186e20f1fdf9206bb4a07e7cd # v0.1.69
        with:
          prompt: ${{ inputs.prompt }}
          model: openai/gpt-6.1-sol
          push: restricted
          timeout: 20m
